name: Build

on:
  workflow_dispatch:

  push:
    branches: [develop-ng]
    tags:
      - 'v[0-9]*'

  pull_request:
    branches: [develop-ng]

jobs:
  Verify:
    runs-on: ubuntu-latest

    env:
      GOPATH: /home/runner/go

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set Go version
        id: go_version
        run: |
          GO_VERSION=$(sed -E -n '/^go / s/^go ([0-9]+\.[0-9]+)(\.[0-9]+)?$/\1/p' < go.mod)
          echo "version=${GO_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go_version.outputs.version }}

      - name: Cache Godel assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.godel
          key: ${{ runner.os }}-godel-${{ hashFiles('godelw', 'godel/config/godel.yml') }}
          restore-keys: |
            ${{ runner.os }}-godel-

      - name: Verify
        run: ./godelw verify --apply=false

  Dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GOPATH: /home/runner/go

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set Go version
        id: go_version
        run: |
          GO_VERSION=$(sed -E -n '/^go / s/^go ([0-9]+\.[0-9]+)(\.[0-9]+)?$/\1/p' < go.mod)
          echo "version=${GO_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go_version.outputs.version }}

      - name: Cache Godel assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.godel
          key: ${{ runner.os }}-godel-${{ hashFiles('godelw', 'godel/config/godel.yml') }}
          restore-keys: |
            ${{ runner.os }}-godel-

      - name: Build distribution
        run: ./godelw dist

      - name: Archive distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: |
            build/bulldozer/*/bin/*.tgz

      # Binaries for all os-archs, made available to the per-platform Docker image jobs below.
      - name: Archive dist binaries for Docker builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-bin
          path: build/bulldozer
          retention-days: 1

      #
      # Steps after this point should only run when publishing
      # Include them here to avoid exporting the Docker container as an artifact
      #

      - name: Publish release assets
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: ./godelw publish github --add-v-prefix --api-url=${GITHUB_API_URL} --user=NextGenContributions --repository=bulldozer --token=${{ secrets.GITHUB_TOKEN }}

  # Builds (and, when publishing, pushes by digest) a single-arch Docker image on a native runner for each
  # platform. The digests are merged into a single multi-arch manifest by MergePushedImages.
  BuildAndPushImage:
    name: Build and push Docker image
    needs:
      - Dist
    env:
      IMAGE: ghcr.io/nextgencontributions/bulldozer
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download dist binaries
        uses: actions/download-artifact@v4
        with:
          name: dist-bin
          path: build/bulldozer

      - name: Login to GitHub Container registry
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: ./godelw docker build --verbose

      - name: Push snapshot image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop-ng' }}
        run: |
          ./godelw docker push --tags=snapshot
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:snapshot" | cut -d'@' -f2)
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload snapshot digest
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop-ng' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-snapshot-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Push release image
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          ./godelw docker push --tags=latest,version
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:latest" | cut -d'@' -f2)
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload release digest
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-release-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the per-platform image digests pushed by BuildAndPushImage into multi-arch manifests.
  MergePushedImages:
    name: Merge pushed Docker images
    runs-on: ubuntu-latest
    needs:
      - BuildAndPushImage
    env:
      IMAGE: ghcr.io/nextgencontributions/bulldozer
    permissions:
      packages: write
    steps:
      - name: Download snapshot digests
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop-ng' }}
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests/snapshot
          pattern: digests-snapshot-*
          merge-multiple: true

      - name: Download release digests
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests/release
          pattern: digests-release-*
          merge-multiple: true

      - name: Set up Docker Buildx
        if: ${{ github.event_name == 'push' }}
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GitHub Container registry
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push snapshot manifest
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop-ng' }}
        working-directory: ${{ runner.temp }}/digests/snapshot
        run: |
          docker buildx imagetools create -t "${IMAGE}:snapshot" $(printf "${IMAGE}@sha256:%s " *)

      - name: Create and push release manifest
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        working-directory: ${{ runner.temp }}/digests/release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" $(printf "${IMAGE}@sha256:%s " *)

  ci-all:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      - Verify
      - Dist
      - BuildAndPushImage
      - MergePushedImages
    steps:
    - name: Check required job results
      run: |
        if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
          echo "One or more required jobs did not succeed"
          echo '${{ toJSON(needs) }}'
          exit 1
        fi
        echo "All required jobs succeeded"
